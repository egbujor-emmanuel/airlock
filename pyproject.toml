[project]
name = "airlock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "egbujor-emmanuel", email = "egbujore73@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dilithium-py>=1.5.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
airlock-envoy = "airlock.envoy:main"
airlock-bench = "airlock.bench:main"
